<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AeroSense · Control</title>
<style>
:root{color-scheme:dark;--bg:#0b0f10;--panel:#111719;--line:#2a3538;--text:#e9eeec;--muted:#9baaa5;--green:#8bb59c;--red:#d88a83;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1560px;margin:auto;padding:30px 36px}header{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line);padding-bottom:25px}header img{width:215px;height:auto}header span{color:var(--muted);letter-spacing:.16em;font-size:13px}#connection{margin-left:auto;letter-spacing:0;padding:9px 14px;border:1px solid var(--line);border-radius:5px}.good{color:var(--green)}.bad,.failed{color:var(--red)}.muted{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:18px;margin:26px 0}h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 20px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}select,input,button{font:inherit;color:var(--text);border:1px solid var(--line);background:#0b1012;border-radius:5px;padding:11px 13px}input,select{width:100%;min-height:43px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button[type=submit]{background:#25473a;border-color:#557b65;width:100%;margin-top:20px}button:hover:not(:disabled){border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}.toolbar select{width:240px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.reading{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:7px;min-height:142px}.reading .name{font-size:14px;color:var(--muted)}.reading .value{display:block;font-variant-numeric:tabular-nums;font-size:29px;margin:13px 0 8px}.reading .value small{font-size:14px;color:var(--muted);margin-left:8px}.reading .quality{font-size:12px}#telemetry-time{font-size:13px;color:var(--muted);margin-left:auto}.field{margin-top:18px}.note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px}#receipt{font-size:13px;line-height:1.8;overflow-wrap:anywhere;margin-top:18px;min-height:35px}.bottom{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.panel-heading{display:flex;align-items:center;gap:12px}.panel-heading select{max-width:190px;margin-left:auto}#trend{width:100%;height:190px;display:block}#trend-note{font-size:12px;color:var(--muted)}#events{max-height:240px;overflow:auto;list-style:none;padding:0;margin:0}#events li{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:14px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}#events time{color:var(--muted);white-space:nowrap}.feedback{color:var(--green)}footer{margin-top:25px;color:var(--muted);font-size:12px}#error{min-height:20px;font-size:13px;color:var(--red);margin-bottom:16px}svg text{fill:var(--muted);font:11px sans-serif}
@media(max-width:1150px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1fr) 310px}main{padding:24px}.reading .value{font-size:24px}}
@media(max-width:800px){.layout,.bottom{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}header{gap:12px}header img{width:150px}header span{font-size:11px}.toolbar{flex-wrap:wrap}#telemetry-time{margin-left:0;width:100%}.panel{padding:20px}}
</style>
</head>
<body><main>
<header><img src="/brand.png" alt="AeroSense"><span>CONTROL / 1.0</span><span id="connection" role="status">正在连接</span></header>
<div class="toolbar"><h1>生产监控</h1><select id="device" aria-label="设备单元"></select><span id="telemetry-time">等待设备数据</span></div>
<div id="error" role="alert"></div>
<div class="layout">
<section aria-label="设备采集数据"><div id="readings" class="cards"></div></section>
<section class="panel"><h2>控制指令</h2><form id="command-form">
<label for="point">控制点</label><select id="point"></select>
<div class="field"><label for="value">目标值</label><input id="value" type="number" required><div id="limits" class="note"></div></div>
<div class="field"><label for="token">操作凭证</label><input id="token" type="password" autocomplete="off" spellcheck="false"></div>
<button id="submit" type="submit" disabled>下发指令</button>
</form><div id="receipt" role="status">等待指令</div></section>
</div>
<div class="bottom">
<section class="panel"><div class="panel-heading"><h2>采集趋势</h2><select id="trend-point" aria-label="趋势数据点"></select></div><svg id="trend" viewBox="0 0 600 190" role="img" aria-label="最近十分钟采集趋势"></svg><div id="trend-note">等待历史数据</div></section>
<section class="panel"><h2>运行记录</h2><ul id="events" aria-live="polite"></ul></section>
</div>
<footer>云雾工厂项目团队 · AeroSense / AeroSense Autonomy</footer>
</main><script src="/console.js"></script></body></html>
